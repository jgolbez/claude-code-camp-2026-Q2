# Boukensha config for playing the MUD as Perry.
# Point the runtime here with BOUKENSHA_DIR=<repo>/.boukensha

mud:
  host: localhost
  port: 4000
  username: perry
  password: platypus
  class: thief   # selects class-specific tools (steal/stealth); generic tools are class-agnostic

tasks:
  player:
    provider: anthropic
    # Start on a fast/cheap model to validate the loop; bump to
    # claude-sonnet-5 (or claude-opus-4-8) for better in-game decisions.
    model: claude-haiku-4-5

system:
  override: true          # use prompts/system.md as the full system prompt

agent:
  max_iterations: 40      # tool calls allowed per player turn
  max_output_tokens: 1024
  max_turn_tokens: 120000  # Bounded, not unbounded (Obs 12 ran to 346K when 0 =
                           # disabled — too loose). 60K was artificially small
                           # (Obs 11 hit it mid-task at iter 22); 120K clears a
                           # real exploration+combat task with the early-stop
                           # discipline in prompts/system.md, while still catching
                           # runaway. Revisit downward once message-history caching
                           # lands (would make each iteration much cheaper).
  compaction_threshold: 0.85
